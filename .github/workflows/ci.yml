name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high

      # The Prisma client is generated code the checked-in sources import, so it
      # has to exist before anything type-checks.
      - run: pnpm --filter @dpd/database prisma:generate

      - run: pnpm -r typecheck
      - run: pnpm lint
      - run: pnpm -r test
      - run: node --test tests/infra.test.mjs

      # A build catches what typecheck cannot: server-only modules reaching
      # client components, which is a real failure this project has already hit.
      - run: pnpm --filter @dpd/web build
        env:
          AUTH_SECRET: build-only-secret-at-least-32-characters-long

  publish:
    needs: check
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - target: web
            image: d-view
          - target: schema
            image: d-view-schema
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: |
            ghcr.io/primebuild-pc/${{ matrix.image }}:latest
            ghcr.io/primebuild-pc/${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
