name: Release

# Fires on a merge to main, but only actually releases when the version in
# package.json changed. Releasing on every merge would produce a stream of
# meaningless versions; requiring a manual tag means it never happens. Bumping
# the version is the deliberate act, and this turns it into a release.
on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: version
        name: Read version and check whether it is new
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "Tag v$version already exists; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.version.outputs.release == 'true'

      - uses: actions/setup-node@v4
        if: steps.version.outputs.release == 'true'
        with:
          node-version: 22
          cache: pnpm

      # Releasing something that does not build would be worse than not
      # releasing, so the gate runs here too rather than trusting that CI passed.
      - if: steps.version.outputs.release == 'true'
        run: pnpm install --frozen-lockfile

      - if: steps.version.outputs.release == 'true'
        run: pnpm --filter @dpd/database prisma:generate

      - if: steps.version.outputs.release == 'true'
        run: pnpm -r typecheck

      - if: steps.version.outputs.release == 'true'
        run: pnpm lint

      - if: steps.version.outputs.release == 'true'
        run: pnpm -r test

      - if: steps.version.outputs.release == 'true'
        run: pnpm --filter @dpd/web build
        env:
          AUTH_SECRET: build-only-secret-at-least-32-characters-long

      - if: steps.version.outputs.release == 'true'
        name: Write release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Notes are built from commit subjects, not from merged pull requests.
          # This repository commits straight to main, so GitHub's own generator
          # finds no pull requests and produces an empty release.
          previous="$(git tag -l 'v*' --sort=-v:refname | head -n 1)"
          if [ -n "$previous" ]; then
            range="$previous..HEAD"
            echo "## Changes since $previous" > NOTES.md
          else
            range="HEAD"
            echo "## Changes" > NOTES.md
          fi
          echo "" >> NOTES.md
          git log --no-merges --pretty=format:'- %s' "$range" >> NOTES.md
          echo "" >> NOTES.md
          echo "" >> NOTES.md
          echo "Self-hosted: see the [README](https://github.com/${{ github.repository }}#quick-start) to install or upgrade." >> NOTES.md
          cat NOTES.md

      - if: steps.version.outputs.release == 'true'
        name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --title "v$VERSION" --notes-file NOTES.md
