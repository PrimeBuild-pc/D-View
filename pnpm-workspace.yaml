packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true
overrides:
  brace-expansion@<1.1.21: ^1.1.21
  brace-expansion@>=4.0.0 <5.0.12: ^5.0.12
  deepmerge-ts@<8.0.0: ^8.0.0
  effect@<3.20.0: ^3.20.0
  js-yaml@>=4.0.0 <4.3.2: ^4.3.2
  nanoid@<3.3.18: ^3.3.18
  postcss@<=8.5.22: ^8.5.23
  sharp@<0.35.5: ^0.35.5
  source-map-js@>=1.0.0 <1.2.2: ^1.2.2
minimumReleaseAgeExclude:
  - effect@3.20.0
  - postcss@8.5.23
  - brace-expansion@1.1.21 || 5.0.12
  - sharp@0.35.5
  - js-yaml@4.3.2
  - nanoid@3.3.18
  - deepmerge-ts@8.0.0
